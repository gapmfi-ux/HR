<!-- pages/dashboard.html -->
<div class="dashboard-container">
    <div class="dashboard-header">
        <h2>Dashboard</h2>
        <p>Welcome to the HR Management System</p>
    </div>
    
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-info">
                <h3>Total Employees</h3>
                <div class="stat-number" id="totalEmployees">--</div>
            </div>
            <div class="stat-icon">
                <i class="fas fa-users"></i>
            </div>
        </div>
        
        <div class="stat-card">
            <div class="stat-info">
                <h3>Active Employees</h3>
                <div class="stat-number" id="activeEmployees">--</div>
            </div>
            <div class="stat-icon">
                <i class="fas fa-user-check"></i>
            </div>
        </div>
        
        <div class="stat-card">
            <div class="stat-info">
                <h3>Departments</h3>
                <div class="stat-number" id="totalDepartments">--</div>
            </div>
            <div class="stat-icon">
                <i class="fas fa-building"></i>
            </div>
        </div>
        
        <div class="stat-card">
            <div class="stat-info">
                <h3>Pending Leaves</h3>
                <div class="stat-number" id="pendingLeaves">--</div>
            </div>
            <div class="stat-icon">
                <i class="fas fa-clock"></i>
            </div>
        </div>
    </div>
    
    <div class="dashboard-grid">
        <div class="dashboard-card">
            <div class="card-header">
                <h3><i class="fas fa-users"></i> Recent Employees</h3>
                <a href="#" onclick="Router.navigate('employee-list'); return false;" class="view-all">View All →</a>
            </div>
            <div class="card-body">
                <div id="recentEmployeesTable" class="table-container">
                    <div class="loader-small">Loading...</div>
                </div>
            </div>
        </div>
        
        <div class="dashboard-card">
            <div class="card-header">
                <h3><i class="fas fa-calendar-alt"></i> Upcoming Leave</h3>
                <a href="#" onclick="Router.navigate('leave-balance'); return false;" class="view-all">View All →</a>
            </div>
            <div class="card-body">
                <div id="upcomingLeaveList" class="leave-list">
                    <div class="loader-small">Loading...</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="dashboard-card full-width">
        <div class="card-header">
            <h3><i class="fas fa-chart-line"></i> Quick Actions</h3>
        </div>
        <div class="card-body">
            <div class="quick-actions" id="quickActions">
                <!-- Quick action buttons will be populated by JS -->
            </div>
        </div>
    </div>
</div>
