<!-- pages/employee/view.html -->
<div id="employeeViewModal" class="modal">
    <div class="modal-content modal-lg">
        <div class="modal-header">
            <h3><i class="fas fa-user-circle"></i> Employee Profile</h3>
            <button class="modal-close" onclick="EmployeeView.close()">&times;</button>
        </div>
        <div class="modal-body" id="employeeViewBody">
            <div class="loader">Loading...</div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" id="viewEditBtn"><i class="fas fa-edit"></i> Edit</button>
            <button class="btn btn-secondary" id="viewPrintBtn"><i class="fas fa-print"></i> Print</button>
            <button class="btn btn-secondary" onclick="EmployeeView.close()">Close</button>
        </div>
    </div>
</div>
